[package]
name = "agent-ops"
version = "0.4.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
anyhow = "1"
notify = "7"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
unicode-width = "0.2"
notify-rust = "4.12.0"
clap = { version = "4.6.0", features = ["derive"] }
futures = "0.3.32"
toml = "0.8"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = "8"
mime_guess = "2"
ansi-to-tui = "8"

[dev-dependencies]
tempfile = "3.27.0"
