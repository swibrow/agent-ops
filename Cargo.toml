[package]
name = "agent-ops"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
anyhow = "1"
notify = "7"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
